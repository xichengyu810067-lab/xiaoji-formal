<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#fff8fb" /><meta name="xiaoji-game-api-base" content="" /><title>俄羅斯方塊｜小吉遊戲屋</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/games/game.css" /><script src="/games/gameClientCore.js" defer></script><script src="/games/gameClient.js" defer></script></head>
<body><header class="game-header game-shell"><a class="game-brand" href="/index.html"><span class="brand-mark">吉</span><span><strong>小吉遊戲屋</strong><small>伺服器驗證每一步</small></span></a><a class="back-link" href="/index.html">返回官網</a></header>
<main class="game-layout game-shell" data-game-root data-game="tetris"><section class="play-card"><p class="eyebrow">XIAOJI TETRIS</p><h1 data-game-title>俄羅斯方塊</h1><p class="game-message" data-game-message aria-live="polite">正在載入…</p><div class="tetris-stage" data-play-area><canvas class="tetris-board" data-tetris-board width="300" height="600" aria-label="俄羅斯方塊遊戲盤"></canvas><div class="tetris-tools"><div class="preview-card"><p>下一塊</p><canvas class="tetris-preview" data-tetris-preview width="104" height="104" aria-label="下一個方塊預覽"></canvas></div><div class="score-strip"><div><span>積分</span><strong data-tetris-score>0</strong></div><div><span>Combo</span><strong data-tetris-combo>0</strong></div></div><div class="control-card" data-tetris-controls><label>落點第 <strong data-tetris-column-label>4</strong> 欄</label><div class="column-control"><button class="icon-button" type="button" data-game-action data-tetris-left aria-label="向左">←</button><input type="range" min="0" max="9" value="3" data-tetris-column aria-label="落點欄位" /><button class="icon-button" type="button" data-game-action data-tetris-right aria-label="向右">→</button></div><div class="tetris-actions"><button class="icon-button" type="button" data-game-action data-tetris-rotate>旋轉</button><button class="primary-button" type="button" data-game-action data-tetris-drop>落下</button></div></div></div></div></section>
<aside class="game-sidebar"><p class="eyebrow">SERVER VERIFIED</p><h2>本局資訊</h2><div class="game-stats"><div class="game-stat"><span>難度</span><strong data-game-difficulty>—</strong></div><div class="game-stat"><span>已驗證動作</span><strong data-game-turn>0</strong></div><div class="game-stat"><span>結算</span><strong data-game-reward>完成後結算</strong></div></div><div class="rules"><h2>玩法</h2><ul><li>消除完整橫列才計分。</li><li>連續消除提高 Combo；空手落塊會重置。</li><li>20 積分折算 1 吉幣。</li><li>單局上限 20,000 積分／1,000 吉幣，達上限即完成。</li><li>鍵盤可用 ← →、↑ 旋轉、空白鍵落下。</li></ul></div><p class="privacy-note">啟動權杖只放在網址片段，驗證後立即從網址移除；瀏覽器不能自行決定分數。</p></aside></main></body></html>
