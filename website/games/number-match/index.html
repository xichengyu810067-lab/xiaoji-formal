<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#fff8fb" /><meta name="xiaoji-game-api-base" content="" /><title>數字配對｜小吉遊戲屋</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/games/game.css" /><script src="/games/gameClientCore.js" defer></script><script src="/games/gameClient.js" defer></script></head>
<body><header class="game-header game-shell"><a class="game-brand" href="/index.html"><span class="brand-mark">吉</span><span><strong>小吉遊戲屋</strong><small>伺服器驗證每一步</small></span></a><a class="back-link" href="/index.html">返回官網</a></header><main class="game-layout game-shell" data-game-root data-game="number-match"><section class="play-card"><p class="eyebrow">NUMBER MATCH</p><h1 data-game-title>數字配對</h1><p class="game-message" data-game-message aria-live="polite">正在載入…</p><div class="number-stage" data-play-area><div class="number-board" data-number-board role="grid" aria-label="數字配對盤"></div></div></section>
<aside class="game-sidebar"><p class="eyebrow">SERVER VERIFIED</p><h2>本局資訊</h2><div class="game-stats"><div class="game-stat"><span>難度</span><strong data-game-difficulty>—</strong></div><div class="game-stat"><span>剩餘數字</span><strong data-number-left>—</strong></div><div class="game-stat"><span>已驗證動作</span><strong data-game-turn>0</strong></div><div class="game-stat"><span>結算</span><strong data-game-reward>完成後結算</strong></div></div><div class="rules"><h2>玩法</h2><ul><li>依序選兩個上下左右相鄰的數字。</li><li>相同、相加為 10 或相減為 0 即可消除。</li><li>數字會依閱讀順序往前補齊。</li><li>全數消除才依難度發放吉幣。</li></ul></div><p class="privacy-note">每次配對都由小吉重新檢查；無合法配對時遊戲結束，未清空不會誤發獎勵。</p></aside></main></body></html>
