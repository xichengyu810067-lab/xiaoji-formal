<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="theme-color" content="#fff8fb" /><meta name="xiaoji-game-api-base" content="" /><title>數獨｜小吉遊戲屋</title><link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;800;900&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/games/game.css" /><script src="/games/gameClientCore.js" defer></script><script src="/games/gameClient.js" defer></script></head>
<body><header class="game-header game-shell"><a class="game-brand" href="/index.html"><span class="brand-mark">吉</span><span><strong>小吉遊戲屋</strong><small>伺服器驗證每一步</small></span></a><a class="back-link" href="/index.html">返回官網</a></header><main class="game-layout game-shell" data-game-root data-game="sudoku"><section class="play-card"><p class="eyebrow">SUDOKU</p><h1 data-game-title>數獨</h1><p class="game-message" data-game-message aria-live="polite">正在載入…</p><div class="sudoku-stage" data-play-area><div class="sudoku-board" data-sudoku-board role="grid" aria-label="九乘九數獨盤"></div><div class="sudoku-keys" aria-label="數字鍵盤"><button class="number-key" type="button" data-game-action data-sudoku-value="1">1</button><button class="number-key" type="button" data-game-action data-sudoku-value="2">2</button><button class="number-key" type="button" data-game-action data-sudoku-value="3">3</button><button class="number-key" type="button" data-game-action data-sudoku-value="4">4</button><button class="number-key" type="button" data-game-action data-sudoku-value="5">5</button><button class="number-key" type="button" data-game-action data-sudoku-value="6">6</button><button class="number-key" type="button" data-game-action data-sudoku-value="7">7</button><button class="number-key" type="button" data-game-action data-sudoku-value="8">8</button><button class="number-key" type="button" data-game-action data-sudoku-value="9">9</button><button class="number-key" type="button" data-game-action data-sudoku-value="0">清除</button></div></div></section>
<aside class="game-sidebar"><p class="eyebrow">SERVER VERIFIED</p><h2>本局資訊</h2><div class="game-stats"><div class="game-stat"><span>難度</span><strong data-game-difficulty>—</strong></div><div class="game-stat"><span>已驗證動作</span><strong data-game-turn>0</strong></div><div class="game-stat"><span>結算</span><strong data-game-reward>完成後結算</strong></div></div><div class="rules"><h2>玩法</h2><ul><li>每列、每欄與每個九宮格填入 1–9。</li><li>粉色數字可修改，深色題目格不可變更。</li><li>題目具有唯一解。</li><li>正確完成後依難度發放 20／30／50／100 吉幣。</li></ul></div><p class="privacy-note">每一格都會傳給小吉驗證並保存；只有完整答案正確時才會結算。</p></aside></main></body></html>
